server:
  port: 8084

spring:
  application:
    name: insight-service
  # spec-01 s1.3: services MUST NOT share a database.
  # Each service owns an independent in-memory H2 instance.
  datasource:
    url: jdbc:h2:mem:insightdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  # spec-01 s1.1: Spring Cloud Stream for event binding, Kafka Streams for stream processing.
  # Topic names are spec-01 s2.6's and live here as configuration; no adapter hard-codes one.
  cloud:
    function:
      # Two independent functions, composed with a semicolon. Spring Cloud Stream routes each to
      # the binder its signature implies: insightTopology is Kafka Streams, markdownAgent is a
      # plain Consumer on the message-channel binder.
      #
      # FR12 and FR13 are in ONE topology: the stream-table join needs FR12's velocity stream in
      # memory, and a KStream cannot cross between functions without a topic.
      #
      # FR14 is beside it and not inside it (spec-06 s2, ruled 10 September 2026). A model call
      # takes seconds; on a Kafka Streams thread it would stall poll, and exceeding
      # max.poll.interval.ms triggers a rebalance in the middle of FR12's windowed aggregate.
      definition: insightTopology;markdownAgent
    stream:
      bindings:
        insightTopology-in-0:
          destination: item-sold
        insightTopology-in-1:
          destination: velocity-baseline-published
        insightTopology-in-2:
          destination: batch-received
        insightTopology-in-3:
          destination: stock-level-changed
        insightTopology-out-0:
          destination: sell-through-risk-detected
        velocityBaseline-out-0:
          destination: velocity-baseline-published

        # FR14's trigger. The same service produces this topic and consumes it, which is unusual
        # and is exactly what spec-01 s2.6 anticipated when it kept sell-through-risk-detected in
        # Table A: the risk signal is shared vocabulary even while the loop is still internal.
        markdownAgent-in-0:
          destination: sell-through-risk-detected
          group: freshflow-insight-markdown-agent
          consumer:
            # One deliberation at a time. Each holds a binder thread for the length of a model
            # call, and running several in parallel would multiply the cost of a slow model
            # without making any single decision arrive sooner.
            concurrency: 1
        # FR14's output. spec-01 s2.6 Table A: insight -> pricing.
        markdownRecommended-out-0:
          destination: markdown-recommended
      kafka:
        binder:
          brokers: ${FRESHFLOW_KAFKA_BROKERS:localhost:9092}
        bindings:
          velocityBaseline-out-0:
            producer:
              # Keyed by SKU: one row per SKU in the KTable, not a growing log of baselines.
              messageKeyExpression: headers['sku']
              configuration:
                '[key.serializer]': org.apache.kafka.common.serialization.StringSerializer
          markdownRecommended-out-0:
            producer:
              # Keyed by batchId: Kafka orders within a partition, so two recommendations for one
              # batch stay in the order they were made.
              messageKeyExpression: headers['batchId']
              configuration:
                '[key.serializer]': org.apache.kafka.common.serialization.StringSerializer
          markdownAgent-in-0:
            consumer:
              configuration:
                # A deliberation is several model round trips and two HTTP calls to
                # inventory-service. The default five minutes is not obviously enough, and the
                # cost of exceeding it is a consumer-group rebalance, so it is raised to ten.
                # spec-06 s2 flagged this as a consequence to carry into Phase B.
                '[max.poll.interval.ms]': 600000
        streams:
          binder:
            applicationId: freshflow-insight-velocity
            brokers: ${FRESHFLOW_KAFKA_BROKERS:localhost:9092}
            configuration:
              # Make the state stores reflect each record as it is processed. The default record
              # cache would hold updates back for up to the commit interval, and FR12's whole point
              # is that the number moves while you watch it.
              '[statestore.cache.max.bytes]': 0
              '[commit.interval.ms]': 500
          bindings:
            insightTopology-in-0:
              consumer:
                keySerde: org.apache.kafka.common.serialization.Serdes$StringSerde
                valueSerde: com.freshflow.insight.infrastructure.ItemSoldEventSerde
                # spec-01 s2.6, NOT NEGOTIABLE: windows are placed by the producer-assigned
                # occurredAt carried in the event, never by Kafka ingestion time. Without this
                # line Kafka Streams would silently use the broker record timestamp.
                timestampExtractorBeanName: occurredAtTimestampExtractor
            insightTopology-in-1:
              consumer:
                keySerde: org.apache.kafka.common.serialization.Serdes$StringSerde
                valueSerde: com.freshflow.insight.infrastructure.VelocityBaselineSerde
            insightTopology-in-2:
              consumer:
                keySerde: org.apache.kafka.common.serialization.Serdes$StringSerde
                valueSerde: com.freshflow.insight.infrastructure.BatchReceivedEventSerde
                timestampExtractorBeanName: occurredAtTimestampExtractor
            insightTopology-in-3:
              consumer:
                keySerde: org.apache.kafka.common.serialization.Serdes$StringSerde
                valueSerde: com.freshflow.insight.infrastructure.StockLevelChangedEventSerde
                timestampExtractorBeanName: occurredAtTimestampExtractor
            insightTopology-out-0:
              producer:
                keySerde: org.apache.kafka.common.serialization.Serdes$StringSerde
                valueSerde: com.freshflow.insight.infrastructure.SellThroughRiskDetectedEventSerde

# Binds the Kafka Streams topology and the baseline seeder (spec-01 s1.1). The integration-test
# profile sets it false so that the spec-04 MockMvc tests do not require a running broker.
freshflow:
  messaging:
    kafka:
      enabled: true

  # FR14. spec-01 s2.7: the provider is injected here so hosted API and local Ollama are
  # interchangeable without code change, and the API key comes from an environment variable only.
  # NEVER commit a key.
  #
  # The interchangeability is real because the LLM sits behind the MarkdownDecisionAgent port
  # (ADR 0004): moving to Ollama is a second adapter in infrastructure plus a provider value here,
  # and no application-layer code changes. Team ruling R2 admits langchain4j-core plus exactly one
  # provider module, so the alternative is a substitution and not an addition.
  #
  # An empty api-key means FR14 is not configured on this machine. The service still starts and
  # still serves FR12 and FR13; no model is built and the trigger consumer says so.
  llm:
    provider: ${LLM_PROVIDER:google-ai-gemini}
    model: ${LLM_MODEL:}
    # LLM_API_KEY first; GEMINI_API_KEY, the provider's own variable, when that is unset.
    api-key: ${LLM_API_KEY:${GEMINI_API_KEY:}}
    timeout: 60s
    # Model round trips per deliberation. Three tools plus room to correct a mis-called one twice.
    max-steps: 8
    # 0.0 so a demonstration gives the same answer for the same facts; the sample agent repositories use 0.0.
    temperature: 0.0

  # FR12. Property keys recorded in spec-01 s2.7 alongside the price-rule seed.
  insight:
    velocity:
      # spec-02 FR12 MVP simplification: "60-second window for demonstration; production target is
      # a 60-minute window advancing every 5 minutes". Moving to production is a change here and
      # nowhere else; the 12:1 window-to-advance ratio is the same at both scales.
      window-seconds: 60
      advance-seconds: 5
      grace-seconds: 5
      retention-minutes: 10

      # The FR12 velocity baseline, in units per hour. spec-02 requires the comparison but no
      # requirement says where the number comes from -- flagged as a specification gap in
      # docs/ai-log/2026-09-07-week-7-fr12-velocity.md. Seeded onto velocity-baseline-published at
      # startup, where the topology's KTable picks it up.
      baselines:
        - sku: SKU-YOG-1KG
          baseline-velocity-per-hour: 120.0

    # FR14, spec-06 s3's ruling: getBatchDetails reads unit cost over synchronous REST from
    # inventory-service. spec-01 s1.3 permits synchronous REST for agent tool calls and for nothing
    # else; spec-01 s1.2 fixes the port at 8081 for local running.
    inventory:
      base-url: ${INVENTORY_BASE_URL:http://localhost:8081}

    # FR13. Neither number is stated by any requirement -- both are flagged in
    # docs/ai-log/2026-09-07-week-7-fr13-risk.md and recorded in spec-01 s2.7.
    risk:
      # Units of projected shortfall above which a batch is reported at risk. A threshold of zero
      # would alarm on a batch expected to miss clearing by one unit.
      shortfall-threshold: 5.0
      # How many of each 24 hours the shop is open and selling. FR13 projects over "remaining
      # trading hours"; 24 means every remaining hour is a selling hour.
      trading-hours-per-day: 24.0
