# Test profile for pricing-service (Phase 3).
spring:
  datasource:
    url: jdbc:h2:mem:pricingdb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  jpa:
    hibernate:
      ddl-auto: create-drop

# PriceRule seed. FR8 [MVP-CORE, minimal]: "a read endpoint plus seeded configuration
# data is sufficient. Full CRUD is [POST-MVP]." spec-03 s3 fixes the fields; the property
# key names are a Phase 3 assumption. See docs/ai-log/2026-08-26-phase-3.md finding A-1.
freshflow:
  # Week 6: the Kafka adapters are not bound in this profile -- see the note in
  # inventory-service/src/test/resources/application-test.yml. The ports they implement are
  # supplied by PricingTestMessagingConfiguration's recording adapters instead, and the
  # markdown-recommended consumer is exercised by calling its handler directly.
  messaging:
    kafka:
      enabled: false

  pricing:
    price-rules:
      - sku: SKU-YOG-1KG
        base-price: 4.50
        unit-cost: 2.10
        category: DAIRY
        currency: AUD
        margin-floor-ratio: 0.15

# No function is bound in this profile: the markdownRecommended bean lives in the Kafka-conditional
# configuration above, and an empty definition stops Spring Cloud Function looking for it.
spring.cloud.function.definition: ""
