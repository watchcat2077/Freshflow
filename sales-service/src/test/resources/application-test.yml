# Test profile for sales-service (Phase 3).
spring:
  datasource:
    url: jdbc:h2:mem:salesdb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  jpa:
    hibernate:
      ddl-auto: create-drop

# Week 6: freshflow.sales.price-snapshot-seed is gone from this file as well as from
# application.yml -- spec-01 s2.7 retires it now that the price-rule-published adapter has replaced
# the static one behind the unchanged PriceSnapshotFeed port (spec-01 s1.3, ADR 0001).
#
# The price data these tests read is now fed in through that adapter's own ingest path by
# SalesTestMessagingConfiguration, which is the same path the Kafka binding uses. sales-service
# still makes no call to pricing-service, because none is permitted to exist.
#
# The Kafka adapters are not bound in this profile, so the MockMvc tests need no broker. The
# transport is verified end to end against the real broker instead; see
# docs/ai-log/2026-09-07-week-6-kafka.md.
freshflow:
  messaging:
    kafka:
      enabled: false

spring.cloud.function.definition: ""
