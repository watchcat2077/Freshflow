server:
  port: 8082

spring:
  application:
    name: sales-service
  # spec-01 s1.3: services MUST NOT share a database.
  # Each service owns an independent in-memory H2 instance.
  datasource:
    url: jdbc:h2:mem:salesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

# PriceSnapshot seed, consumed by the PriceSnapshotFeed port's Week 5 static-configuration
# adapter (spec-01 s1.3 and s2.7, spec-03 s2, ADR 0001). This is the ONLY channel by which
# price data enters sales-service: it does NOT call pricing-service.
# Retired in Week 6, when the price-rule-published adapter replaces the static one behind
# the unchanged port.
freshflow:
  sales:
    price-snapshot-seed:
      - sku: SKU-YOG-1KG
        base-price: 4.50
        unit-cost: 2.10
        category: DAIRY
        currency: AUD
