server:
  port: 8082

spring:
  application:
    name: sales-service
  # spec-01 s1.3: services MUST NOT share a database.
  # Each service owns an independent in-memory H2 instance.
  datasource:
    url: jdbc:h2:mem:salesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  # spec-01 s1.1: event binding is Spring Cloud Stream over the Kafka binder.
  # Single-node Kafka in KRaft mode, from docker-compose.yml.
  # Topic names are spec-01 s2.6's and live here as configuration; no adapter hard-codes one.
  cloud:
    function:
      # The price-rule-published subscription (SalesMessagingConfiguration#priceRulePublished) and,
      # since 4 October 2026, the markdown-applied subscription (#markdownApplied) for FR6b. Two
      # function beans in one definition, semicolon-separated as Spring Cloud Function requires.
      # The test profile overrides this with "" because neither binding is built there.
      definition: priceRulePublished;markdownApplied
    stream:
      bindings:
        itemSold-out-0:
          destination: item-sold
        priceRulePublished-in-0:
          destination: price-rule-published
        markdownApplied-in-0:
          destination: markdown-applied
      kafka:
        binder:
          brokers: ${FRESHFLOW_KAFKA_BROKERS:localhost:9092}
        bindings:
          itemSold-out-0:
            producer:
              messageKeyExpression: headers['sku']
              configuration:
                '[key.serializer]': org.apache.kafka.common.serialization.StringSerializer
          priceRulePublished-in-0:
            consumer:
              # No consumer group is set, so each instance joins an anonymous one and replays the
              # topic from the beginning. That is deliberate: the local PriceSnapshot is a
              # materialised view of the whole topic, not a work queue, so every instance needs
              # every event rather than a share of them. Replay is safe because the adapter
              # deduplicates on eventId and resolves conflicts by occurredAt (spec-01 s2.6).
              start-offset: earliest
          markdownApplied-in-0:
            consumer:
              # The same arrangement as price-rule-published, for the same reason: the markdown is
              # part of the same materialised view, so every instance needs every event. An
              # anonymous group replays the whole topic on every start, and replay is safe because
              # the adapter deduplicates on eventId and keeps the latest markdown per SKU by
              # occurredAt (FR6b, spec-01 s2.6). The two bindings replay independently, so either
              # topic may be read first; the adapter composes by event time and does not care.
              start-offset: earliest

# Binds the Kafka adapters (spec-01 s1.1). The integration-test profile sets it false so that the
# spec-04 MockMvc tests do not require a running broker.
#
# freshflow.sales.price-snapshot-seed is GONE, as spec-01 s2.7 "Week 6 consequence" requires: the
# static-configuration adapter behind PriceSnapshotFeed has been replaced by the
# price-rule-published subscription above, behind the same unchanged port (spec-01 s1.3, ADR 0001).
# sales-service still does not call pricing-service, and the topic is now the only channel by which
# price data enters this service.
freshflow:
  messaging:
    kafka:
      enabled: true
