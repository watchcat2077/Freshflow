openapi: 3.0.3
info:
  title: FreshFlow — Integration Test Contract
  description: >
    Specification 4. Defines the API endpoints on the MVP demonstration path.
    Integration test cases are generated from this contract BEFORE implementation
    (Continuous Auto-Validation). Every endpoint here traces to a functional
    requirement in spec-02-requirements.md.
    Minimalist scope: only endpoints on the 17 August demonstration path are defined.

    TIMESTAMPS IN EXAMPLES (amended 26 August 2026, Phase 3 finding S-1).
    Any example timestamp that a validation rule requires to be in the future MUST be
    forward-dated or expressed relatively. It must never be a fixed date that the passage
    of time turns invalid. This applies to CreateBatchRequest.expiryAt, which FR1 requires
    to be in the future, and to the effectiveFrom/effectiveTo promotion window of
    CreateMarkdownPlanRequest. Before this amendment the yoghurt example carried
    expiryAt 2026-08-18T22:00:00Z, which had already passed, so the contract's own
    happy-path example would have been rejected with 400 rather than the 201 it
    illustrates. Integration tests MUST compute such values relative to the moment of
    execution rather than copying the literal from this document.

    CreateTransactionRequest.occurredAt is deliberately exempt: it records when a sale
    happened, so a past instant is correct and no rule orders it against now.
  version: "1.0"

servers:
  - url: http://localhost:8081
    description: inventory-service
  - url: http://localhost:8082
    description: sales-service
  - url: http://localhost:8083
    description: pricing-service
  - url: http://localhost:8084
    description: insight-service

tags:
  - name: inventory
    description: inventory-service, port 8081
  - name: sales
    description: sales-service, port 8082
  - name: pricing
    description: pricing-service, port 8083
  - name: insight
    description: insight-service, port 8084

paths:

  /api/batches:
    post:
      tags: [inventory]
      summary: Register a goods receipt as a stock batch
      description: "Implements FR1. Publishes batch-received on success."
      operationId: createBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
            examples:
              yoghurt:
                value:
                  sku: "SKU-YOG-1KG"
                  quantity: 50
                  expiryAt: "2027-02-18T22:00:00Z"
                  unitCost: { amount: 2.10, currency: "AUD" }
                  supplierRef: "DEL-88213"
      responses:
        '201':
          description: Batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          description: Validation failed — non-positive quantity or expiry in the past
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [inventory]
      summary: List the active batches of a SKU with their remaining shelf life
      description: >
        Implements FR4 (added 4 October 2026). Returns the ACTIVE batches of the given SKU in
        first-expired-first-out order, which is the order FR2 deducts them in. Each entry carries
        remainingShelfLifeHours computed against the service clock at the moment of the request.
        A SKU with no active batch answers 200 with an empty array; it is not an error.
      operationId: listBatchesBySku
      parameters:
        - name: sku
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Active batches of the SKU, soonest expiry first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchResponse'
        '400':
          description: The sku query parameter is missing or blank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/batches/{batchId}:
    get:
      tags: [inventory]
      summary: Get batch detail
      description: "Implements FR4. Also backs the getBatchDetails agent tool (FR14)."
      operationId: getBatch
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Batch found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '404':
          description: Batch not found

  /api/transactions:
    post:
      tags: [sales]
      summary: Record a sale transaction
      description: >
        Implements FR5, FR6a and FR6b. Applies the price in force for each line item's
        SKU at the transaction's occurredAt, read from sales-service's own local
        PriceSnapshot (populated through the PriceSnapshotFeed inbound port from
        price-rule-published and, since 4 October 2026, markdown-applied), and publishes
        one item-sold event per line item. When an activated markdown's promotion window
        contains occurredAt the line carries the discounted price and markdownApplied is
        true; otherwise the base price and false.
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
            examples:
              singleScan:
                value:
                  tillId: "TILL-02"
                  occurredAt: "2026-08-17T09:15:00Z"
                  lineItems:
                    - sku: "SKU-YOG-1KG"
                      quantity: 1
      responses:
        '201':
          description: Transaction recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: >
            Validation failed — empty line items, non-positive quantity, or a SKU absent
            from the local PriceSnapshot (FR6a). The last case was added 26 August 2026
            (Phase 3 finding S-2): FR6a requires that a scan of a SKU absent from the
            snapshot is a 400, never a silent zero price, and this response did not
            previously admit it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/prices/{sku}:
    get:
      tags: [pricing]
      summary: Get the effective price and margin floor for a SKU
      description: "Implements FR8. Backs the getMarginFloor agent tool."
      operationId: getPrice
      parameters:
        - name: sku
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Price rule found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
        '404':
          description: No price rule for this SKU
    put:
      tags: [pricing]
      summary: Create or replace the price rule and margin floor for a SKU
      description: >
        Implements FR8 beyond the seeded minimum (added 4 October 2026). The SKU in the path is
        the identity of the rule; the body carries everything else. Creating a rule answers 201,
        replacing one answers 200. Either way the rule in force is announced on
        price-rule-published so that sales-service's local PriceSnapshot follows it (spec-01 s1.3,
        ADR 0001). The domain rejects a base price below unit cost and a margin floor outside
        [0, 1]; both surface as 400.
      operationId: upsertPriceRule
      parameters:
        - name: sku
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPriceRuleRequest'
            examples:
              strawberries:
                value:
                  basePrice: { amount: 6.00, currency: "AUD" }
                  unitCost: { amount: 3.00, currency: "AUD" }
                  category: "PRODUCE"
                  marginFloorRatio: 0.20
      responses:
        '200':
          description: Existing rule replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
        '400':
          description: Validation failed — missing field, currency mismatch, base price below cost, or margin floor out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/markdown-plans:
    post:
      tags: [pricing]
      summary: Propose and activate a markdown plan
      description: >
        Implements FR9 and FR11. The margin floor is validated inside the domain layer.
        A breaching proposal is rejected with 422 regardless of whether it originated
        from a human or from the LLM agent. This endpoint is the Anti-Corruption Layer
        enforcement point.

        Margin arithmetic (ruled 4 October 2026, closing spec-03 open items B-3 and B-6):
        resultingPrice = basePrice x (1 - tier/100), rounded half-up to cents;
        resultingMarginRatio = (resultingPrice - unitCost) / resultingPrice. A plan is
        activated only when resultingMarginRatio >= marginFloorRatio. With the seeded
        SKU-YOG-1KG (base 4.50, cost 2.10, floor 0.15) the tiers PERCENT_20 and PERCENT_30
        pass and PERCENT_50 and PERCENT_60 are rejected, which is what the two examples below
        demonstrate. The same arithmetic runs when pricing-service consumes a
        markdown-recommended event from the agent; the HTTP endpoint and the Kafka consumer
        are two entry points to one application service and one domain rule.
      operationId: createMarkdownPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMarkdownPlanRequest'
            examples:
              accepted:
                summary: Within margin floor — expect 201
                value:
                  batchId: "BAT-0001"
                  sku: "SKU-YOG-1KG"
                  discountTier: "PERCENT_30"
                  effectiveFrom: "2027-02-17T09:30:00Z"
                  effectiveTo: "2027-02-18T22:00:00Z"
                  origin: "AGENT"
                  rationale: "41 units remaining, 9 trading hours to expiry, velocity 2.1/h"
                  agentTraceId: "TRC-0001"
              rejected:
                summary: Breaches margin floor — expect 422
                value:
                  batchId: "BAT-0001"
                  sku: "SKU-YOG-1KG"
                  discountTier: "PERCENT_60"
                  effectiveFrom: "2027-02-17T09:30:00Z"
                  effectiveTo: "2027-02-18T22:00:00Z"
                  origin: "AGENT"
                  rationale: "Aggressive clearance"
                  agentTraceId: "TRC-0002"
      responses:
        '201':
          description: Markdown plan activated. Publishes markdown-applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownPlanResponse'
        '422':
          description: >
            Rejected — the discounted price would breach the margin floor.
            The rejection is persisted as a REJECTED plan and is queryable by its id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginFloorRejection'
        '400':
          description: Validation failed — missing field, unknown tier, or effectiveTo not after effectiveFrom
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No price rule exists for the SKU, so there is no floor to check against
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/markdown-plans/{markdownPlanId}:
    get:
      tags: [pricing]
      summary: Get a markdown plan, including a rejected one
      description: >
        Implements the "rejection is recorded and queryable" criterion of FR11 (added
        4 October 2026). A rejected proposal is kept as a plan in status REJECTED with its
        rejectionReason, so an auditor can see what the agent (or a human) asked for and why
        the Pricing domain refused it.
      operationId: getMarkdownPlan
      parameters:
        - name: markdownPlanId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Markdown plan found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownPlanResponse'
        '404':
          description: No plan with this id

  /api/insight/velocity/{sku}:
    get:
      tags: [insight]
      summary: Current rolling sell-through velocity for a SKU
      description: >
        Implements FR12. Served from the Kafka Streams state store via Interactive Query.
        The value changes as item-sold events arrive.
      operationId: getVelocity
      parameters:
        - name: sku
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Velocity view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VelocityResponse'
        '404':
          description: No windowed data for this SKU yet

  /api/insight/risks:
    get:
      tags: [insight]
      summary: List batches currently flagged as at risk of expiring unsold
      description: "Implements FR13."
      operationId: listRisks
      responses:
        '200':
          description: Risk views
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RiskResponse'

  /api/insight/agent-traces/{agentTraceId}:
    get:
      tags: [insight]
      summary: Retrieve the full tool-call trace for an agent decision
      description: >
        Implements FR14. Makes the agent's reasoning auditable — the ordered sequence
        of tool calls, their arguments and results, and the final recommendation.
      operationId: getAgentTrace
      parameters:
        - name: agentTraceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Agent trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTraceResponse'
        '404':
          description: Trace not found

  /api/insight/briefings:
    post:
      tags: [insight]
      summary: Ask the briefing agent for an end-of-day summary
      description: >
        Implements FR15 (added 4 October 2026). A second agentic use case served by a second
        agent behind the same kind of port as FR14. The agent gathers the day's evidence
        through its tools (the current risk list, the markdown recommendations made that
        day, and the sell-through rate of any SKU it wants to look at) and writes a short
        plain-language briefing for the store owner. The counts in the response are computed
        by the orchestrator from the tool results, not taken from the model's text, so a
        number the model gets wrong cannot reach the caller as a fact. The tool calls are
        persisted with the briefing so the narrative can be checked against its evidence.
      operationId: createBriefing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BriefingRequest'
            examples:
              today:
                value:
                  businessDate: "2026-10-05"
      responses:
        '201':
          description: Briefing generated and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefingResponse'
        '503':
          description: >-
            No LLM is configured in this environment, so no briefing agent is wired
            (error AGENT_NOT_CONFIGURED); or an agent is wired and its model could not be used
            just now, for example a provider rate limit or timeout (error AGENT_UNAVAILABLE,
            added 5 October 2026 after the live run; nothing is stored in that case)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/insight/briefings/{briefingId}:
    get:
      tags: [insight]
      summary: Retrieve a persisted briefing with its tool-call trace
      description: "Implements FR15. Makes the briefing auditable in the same way FR14's trace does."
      operationId: getBriefing
      parameters:
        - name: briefingId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Briefing found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefingResponse'
        '404':
          description: Briefing not found

components:
  schemas:

    MoneyDto:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number, format: double, example: 2.10 }
        currency: { type: string, example: "AUD" }

    CreateBatchRequest:
      type: object
      required: [sku, quantity, expiryAt, unitCost]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        expiryAt: { type: string, format: date-time }
        unitCost: { $ref: '#/components/schemas/MoneyDto' }
        supplierRef: { type: string }

    BatchResponse:
      type: object
      properties:
        batchId: { type: string }
        sku: { type: string }
        receivedQuantity: { type: integer }
        remainingQuantity: { type: integer }
        expiryAt: { type: string, format: date-time }
        unitCost: { $ref: '#/components/schemas/MoneyDto' }
        status: { type: string, enum: [ACTIVE, DEPLETED, WRITTEN_OFF] }
        remainingShelfLifeHours: { type: integer }

    CreateTransactionRequest:
      type: object
      required: [tillId, lineItems]
      properties:
        tillId: { type: string }
        occurredAt: { type: string, format: date-time }
        lineItems:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: { type: string }
              quantity: { type: integer, minimum: 1 }

    TransactionResponse:
      type: object
      properties:
        transactionId: { type: string }
        tillId: { type: string }
        occurredAt: { type: string, format: date-time }
        totalAmount: { $ref: '#/components/schemas/MoneyDto' }
        lineItems:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              quantity: { type: integer }
              unitPrice: { $ref: '#/components/schemas/MoneyDto' }
              markdownApplied: { type: boolean }

    PriceResponse:
      type: object
      properties:
        sku: { type: string }
        category: { type: string }
        basePrice: { $ref: '#/components/schemas/MoneyDto' }
        unitCost: { $ref: '#/components/schemas/MoneyDto' }
        effectivePrice: { $ref: '#/components/schemas/MoneyDto' }
        marginFloorRatio: { type: number, format: double, example: 0.15 }
        activeDiscountTier:
          type: string
          nullable: true
          enum: [PERCENT_20, PERCENT_30, PERCENT_50, PERCENT_60, null]

    CreateMarkdownPlanRequest:
      type: object
      required: [batchId, sku, discountTier, effectiveFrom, effectiveTo, origin]
      properties:
        batchId: { type: string }
        sku: { type: string }
        discountTier: { type: string, enum: [PERCENT_20, PERCENT_30, PERCENT_50, PERCENT_60] }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }
        origin: { type: string, enum: [HUMAN, AGENT] }
        rationale: { type: string }
        agentTraceId: { type: string, nullable: true }

    UpsertPriceRuleRequest:
      type: object
      required: [basePrice, unitCost, category, marginFloorRatio]
      properties:
        basePrice: { $ref: '#/components/schemas/MoneyDto' }
        unitCost: { $ref: '#/components/schemas/MoneyDto' }
        category: { type: string }
        marginFloorRatio: { type: number, format: double, minimum: 0, maximum: 1 }

    MarkdownPlanResponse:
      type: object
      properties:
        markdownPlanId: { type: string }
        batchId: { type: string }
        sku: { type: string }
        discountTier: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }
        status: { type: string, enum: [PROPOSED, ACTIVE, EXPIRED, REJECTED] }
        origin: { type: string, enum: [HUMAN, AGENT] }
        discountedPrice:
          description: Present when the plan is ACTIVE; absent for a REJECTED plan
          $ref: '#/components/schemas/MoneyDto'
        rationale: { type: string, nullable: true }
        agentTraceId: { type: string, nullable: true }
        rejectionReason:
          type: string
          nullable: true
          description: Set only when status is REJECTED; the same text as MarginFloorRejection.message
        createdAt: { type: string, format: date-time }

    BriefingRequest:
      type: object
      properties:
        businessDate:
          type: string
          format: date
          description: The day to brief on. Defaults to today in UTC when the body is omitted.

    BriefingResponse:
      type: object
      properties:
        briefingId: { type: string }
        businessDate: { type: string, format: date }
        generatedAt: { type: string, format: date-time }
        summary:
          type: string
          description: The agent's plain-language briefing
        riskCount:
          type: integer
          description: Batches currently at risk, counted by the orchestrator from the tool result
        recommendationCount:
          type: integer
          description: Markdown recommendations made on businessDate, counted by the orchestrator
        toolCalls:
          type: array
          items:
            type: object
            properties:
              sequence: { type: integer }
              toolName: { type: string }
              arguments: { type: string }
              result: { type: string }
              timestamp: { type: string, format: date-time }

    MarginFloorRejection:
      type: object
      description: >
        Returned with HTTP 422 when the margin floor invariant would be breached. The rejected
        plan is persisted in status REJECTED, and markdownPlanId (added 4 October 2026) is how
        the caller finds it again through GET /api/markdown-plans/{markdownPlanId}.
      properties:
        error: { type: string, example: "MARGIN_FLOOR_BREACH" }
        markdownPlanId: { type: string, example: "MDP-3F9A1C02" }
        sku: { type: string }
        requestedTier: { type: string }
        resultingPrice: { $ref: '#/components/schemas/MoneyDto' }
        unitCost: { $ref: '#/components/schemas/MoneyDto' }
        resultingMarginRatio: { type: number, format: double, example: -0.1667 }
        marginFloorRatio: { type: number, format: double, example: 0.15 }
        message:
          type: string
          example: "Discount tier PERCENT_60 yields margin -0.1667, below floor 0.15"

    VelocityResponse:
      type: object
      properties:
        sku: { type: string }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        quantitySold: { type: integer }
        velocityPerHour: { type: number, format: double }
        baselineVelocity: { type: number, format: double }
        velocityRatio: { type: number, format: double }

    RiskResponse:
      type: object
      properties:
        batchId: { type: string }
        sku: { type: string }
        remainingQuantity: { type: integer }
        hoursToExpiry: { type: integer }
        currentVelocity: { type: number, format: double }
        projectedSales: { type: number, format: double }
        projectedShortfall: { type: number, format: double }
        detectedAt: { type: string, format: date-time }

    AgentTraceResponse:
      type: object
      properties:
        agentTraceId: { type: string }
        triggerEventId: { type: string }
        batchId: { type: string }
        toolCalls:
          type: array
          items:
            type: object
            properties:
              sequence: { type: integer }
              toolName: { type: string }
              arguments: { type: string }
              result: { type: string }
              timestamp: { type: string, format: date-time }
        finalRecommendation: { type: string }
        rationale: { type: string }
        completedAt: { type: string, format: date-time }

    ErrorResponse:
      type: object
      description: >
        error is a stable code and message is for a human. The application layer assigns
        the codes behind the 400, 404 and 422 responses above. A request body that cannot
        be parsed as JSON never reaches the application layer: each service's
        GlobalExceptionHandler in the presentation layer answers it with 400 and the code
        MALFORMED_REQUEST (13 October 2026).
      properties:
        error: { type: string }
        message: { type: string }
