# Test profile for inventory-service (Phase 3).
# No seed data: spec-04 creates batches through POST /api/batches, so the tests
# seed themselves through the API rather than behind it.
spring:
  datasource:
    url: jdbc:h2:mem:inventorydb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  jpa:
    hibernate:
      ddl-auto: create-drop

# Week 6: the Kafka adapters are not bound in this profile, so these MockMvc tests -- which assert
# the HTTP behaviour of spec-04 -- do not require a running broker. The ports they sit behind are
# supplied by test-scope adapters instead (Ports and Adapters, applied to testing). The Kafka
# transport itself is verified end to end against the real broker; see
# docs/ai-log/2026-09-07-week-6-kafka.md.
freshflow:
  messaging:
    kafka:
      enabled: false
